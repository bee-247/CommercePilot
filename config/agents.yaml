version: 1

orchestration:
  mode: mesh
  max_replans: 1
  max_plan_tasks: 6
  llm_planner_enabled: true
  llm_broker_enabled: true
  llm_replanner_enabled: true

broker:
  success_prior_calls: 5
  latency_ceiling_ms: 5000
  weights:
    historical_success: 0.30
    latency: 0.20
    cost: 0.10
    scenario: 0.40

model_profiles:
  deterministic:
    temperature: 0.0
    max_tokens: 700
  conversational:
    temperature: 0.3
    max_tokens: 500
  creative:
    temperature: 0.4
    max_tokens: 1200

  candidate_scoring:
    temperature: 0.0
    max_tokens: 1400
  structured_response:
    temperature: 0.2
    max_tokens: 1600

services:
  candidate-evaluation:
    model_profile: candidate_scoring
    runtime:
      timeout_seconds: 20
      max_attempts: 1

agents:
  conversation-understanding:
    executor: conversation_understanding
    model_profile: deterministic
    model:
      max_tokens: 1100
    runtime:
      timeout_seconds: 25
      max_attempts: 2

  image-understanding:
    executor: image_understanding
    model_profile: conversational
    model:
      temperature: 0.2
      max_tokens: 800
    runtime:
      timeout_seconds: 10
      max_attempts: 2

  memory-update:
    executor: memory_update
    model_profile: deterministic
    model:
      max_tokens: 900
    runtime:
      timeout_seconds: 8
      max_attempts: 2

  product-recommendation:
    executor: product_recommendation
    capabilities: [product_recall]
    runtime:
      timeout_seconds: 8
      max_attempts: 2
      max_concurrency: 8
    broker:
      historical_success: 0.94
      average_latency_ms: 650
      cost_level: 1.2

  quality-reviewer:
    executor: quality_reviewer
    capabilities: [quality_review, quality_recheck]
    model_profile: deterministic
    model:
      max_tokens: 1000
    runtime:
      timeout_seconds: 15
      max_attempts: 1
      max_concurrency: 8
    broker:
      average_latency_ms: 700
      cost_level: 2

  response-generation:
    executor: response_generation
    capabilities: [response_synthesis, response_revision]
    model_profile: creative
    runtime:
      timeout_seconds: 25
      max_attempts: 2
      max_concurrency: 8
    broker:
      average_latency_ms: 1100
      cost_level: 3

  llm-planner:
    executor: llm_planner
    model_profile: deterministic
    model:
      max_tokens: 1200
    runtime:
      timeout_seconds: 15
      max_attempts: 1

  llm-broker:
    executor: llm_broker
    model_profile: deterministic
    model:
      max_tokens: 900
    runtime:
      timeout_seconds: 12
      max_attempts: 1

  llm-replanner:
    executor: llm_replanner
    model_profile: deterministic
    model:
      max_tokens: 1200
    runtime:
      timeout_seconds: 15
      max_attempts: 1

  knowledge-retrieval:
    executor: knowledge_retrieval
    capabilities: [knowledge_retrieval]
    runtime:
      timeout_seconds: 10
      max_attempts: 2
      max_concurrency: 8
    broker:
      average_latency_ms: 900
      cost_level: 2
